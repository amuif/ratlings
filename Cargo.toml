# Don't edit the `bin` list manually. Run `rustlings dev update` after changing
# exercises or solutions.
bin = [
  { name = "snake_arena", path = "exercises/snake/snake_arena.rs" },
  { name = "snake_arena_sol", path = "solutions/snake/snake_arena.rs" },
  { name = "snake_style", path = "exercises/snake/snake_style.rs" },
  { name = "snake_style_sol", path = "solutions/snake/snake_style.rs" },
  { name = "snake_layout", path = "exercises/snake/snake_layout.rs" },
  { name = "snake_layout_sol", path = "solutions/snake/snake_layout.rs" },
]

[package]
name = "ratlings"
version = "0.1.0"
description = "Small and interactive exercises for learning Ratatui"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
ratatui = "0.30.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
